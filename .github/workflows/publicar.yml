# Robot de la web roqueperez.es
# Lee Notion (textos y apuntes) y Substack (ediciones), genera la web y la publica en GitHub Pages.
# Al terminar avisa a Bing (IndexNow) de las páginas nuevas o cambiadas.
# Primero pone al día la BBDD Publicaciones de Notion (Tramitado → Listo y enlaces de Substack que falten); después publica.
# Se ejecuta:
#   - cada día a las 6:15 UTC (8:15 en horario de verano, 7:15 en invierno; siempre después de la newsletter de las 7:00)
#   - cada vez que se sube un cambio al repositorio
#   - a mano: pestaña Actions > "Publicar la web" > Run workflow
name: Publicar la web

on:
  schedule:
    - cron: "15 6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # solo para el paso «Mantener activa la ejecución diaria»
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # una publicación a medias se deja terminar; la siguiente espera su turno

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar la web
        uses: actions/checkout@v4

      - name: Generar la web con Notion y Substack
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MARCAR_PUBLICADOS: si
        run: python3 robot/construir.py

      - name: Preparar el aviso a Bing (IndexNow)
        continue-on-error: true
        run: python3 robot/indexnow.py preparar

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4

      # GitHub apaga las ejecuciones programadas tras 60 días sin cambios en el repositorio.
      # Volver a activar el flujo pone ese contador a cero, así que el robot no se para nunca.
      - name: Mantener activa la ejecución diaria
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publicar.yml/enable"

      - name: Avisar a Bing de las páginas nuevas (IndexNow)
        continue-on-error: true
        run: python3 robot/indexnow.py avisar
